name: team_flo_app
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.91

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  firebase_messaging: ^16.6.0
  flutter_local_notifications: ^22.3.1
  cloud_firestore: ^6.8.0
  firebase_storage: ^13.4.6
  image_picker: ^1.0.0
  photo_view: ^0.15.0
  video_player: ^2.8.0
  provider: ^6.0.0
  intl: ^0.20.3
  uuid: ^4.0.0
  cupertino_icons: ^1.0.2
  image: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  material_color_utilities: ^0.13.0

flutter:
  uses-material-design: true

  assets:
    - lib/assets/images/TeamFlo.png
    - lib/assets/images/belt_ranks/

flutter_launcher_icons:
  image_path: "lib/assets/images/AppIcon.png"
  ios: true
  android: true
  remove_alpha_ios: true
