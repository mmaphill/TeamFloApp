workflows:
  teamflo-ios:
    name: TeamFloApp iOS Build
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.teamflobjj.app
    scripts:
      - name: Build Flutter App
        script: |
          flutter build ipa --release \
            --export-options-plist=$CM_EXPORT_OPTIONS_PLIST
    artifacts:
      - build/ios/ipa/**/*.ipa
